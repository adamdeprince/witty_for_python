[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "witty_for_python"
version = "0.1.0"
description = "Python bindings for the Wt (Web Toolkit) C++ library, generated with nanobind. Built wheels bundle Wt (GPLv2), TinyMCE 6.8.4 (MIT), and link against permissively-licensed system libraries (Boost, libharu, libpng, zlib) — see THIRD_PARTY_LICENSES.md for details."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam DePrince" }]
# Project license. Built wheels also redistribute Wt (vendored at extern/wt
# as a git submodule, GPLv2) and TinyMCE 6.8.4 (vendored at extern/tinymce,
# MIT). Their license files are bundled alongside their binaries inside the
# wheel — see THIRD_PARTY_LICENSES.md for the attribution detail.
license = "GPL-2.0-only"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest >=8"]

[project.urls]
Homepage           = "https://github.com/adamdeprince/witty_for_python"
Repository         = "https://github.com/adamdeprince/witty_for_python"
Issues             = "https://github.com/adamdeprince/witty_for_python/issues"
"Wt upstream"      = "https://www.webtoolkit.eu/wt"
"TinyMCE upstream" = "https://github.com/tinymce/tinymce"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  # Wt's free-threaded build (3.13t / 3.14t) is still experimental in nanobind
  # 2.12 and surfaces some warnings from CPython itself. Silence the noise so
  # real failures stand out.
  "ignore::DeprecationWarning:nanobind",
]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = ">=3.26"
wheel.packages = ["src/witty_for_python"]
# Tag the wheel as cp312-abi3. nanobind's STABLE_ABI mode + scikit-build's
# py-api=cp312 produces a single .so that loads on CPython 3.12 / 3.13 /
# 3.14 (and any future minor with stable-ABI compatibility). We can't go
# below 3.12 because Py_LIMITED_API=0x030C0000 is the floor nanobind 2.x
# uses for its stable ABI. Free-threaded builds (the `t` ABI) are NOT
# stable-ABI compatible and have to be built per Python minor; the
# nanobind_add_module call in CMakeLists.txt picks FREE_THREADED for
# those automatically.
wheel.py-api = "cp312"
# Re-run CMake configure when these change.
cmake.args = []

[tool.scikit-build.cmake.define]
CMAKE_CXX_STANDARD = "23"

# ---- cibuildwheel ----
#
# `cibw` runs the wheel build inside a manylinux container with the
# right toolchain + auditwheel post-processing. For abi3 we only need
# to build ONE wheel — it covers cp312, cp313, cp314.

[tool.cibuildwheel]
# Only the abi3 build (cp312 is enough; py-api=cp312 marks the wheel).
build = "cp312-*"
# Skip 32-bit + PyPy + musllinux. x86_64 manylinux is the target.
skip = "*-musllinux_* *-win32 *-manylinux_i686 pp*"
archs = ["x86_64"]
build-frontend = "build"
build-verbosity = 1
# Bundled system libs we link: Boost (filesystem/system/thread/program_options),
# zlib, libpng, libharu (built from source — not in base repos). dnf is the
# package manager inside manylinux_2_34 / AlmaLinux 9.
#
# Why 2_34 not 2_28: Wt's WMatrix4x4.C pulls in boost::numeric::ublas, whose
# 1.66 (the manylinux_2_28 / AlmaLinux 8 version) calls
# `std::allocator<T>::construct` which is removed in C++20. We compile at
# -std=c++23, so the build fails on _28. Boost 1.75+ (shipped with
# manylinux_2_34) is fine. glibc 2.34 is the floor for the resulting wheel:
# RHEL 9 / Ubuntu 22.04 / Debian 12+.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"

[tool.cibuildwheel.linux]
before-all = [
  # Toolchain.
  "yum install -y gcc-toolset-13 ninja-build cmake git",
  # Build deps for Wt (libharu isn't in AlmaLinux 8 base repos; we
  # build it from source below).
  "yum install -y boost-devel zlib-devel libpng-devel",
  # libharu (HPDF) for WPdfImage. Pinned to 2.4.4 (zlib/libpng license,
  # GPL-compatible). Static + shared; auditwheel bundles the .so into
  # the wheel under <pkg>/.libs/.
  "git clone --depth 1 --branch v2.4.4 https://github.com/libharu/libharu.git /tmp/libharu",
  "cmake -S /tmp/libharu -B /tmp/libharu/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON -DLIBHPDF_EXAMPLES=OFF",
  "cmake --build /tmp/libharu/build --target install",
  "ldconfig",
  # TinyMCE needs Node + yarn (Corepack).
  "curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -",
  "yum install -y nodejs",
  "corepack enable yarn",
]
# auditwheel's default repair re-bundles our vendored libwt.so / libwthttp.so
# (they're already under <pkg>/_libs/ with $ORIGIN/_libs RPATH baked in by
# the install step). Excluding them prevents the duplicate.
repair-wheel-command = "auditwheel repair --exclude libwt.so.4 --exclude libwt.so.4.13.2 --exclude libwthttp.so.4 --exclude libwthttp.so.4.13.2 -w {dest_dir} {wheel}"
# Quick smoke test in the test environment — import + version.
test-command = "python -c 'import witty_for_python; print(witty_for_python.__version__)'"

[tool.cibuildwheel.linux.environment]
CC = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
CXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++"
PATH = "/opt/rh/gcc-toolset-13/root/usr/bin:$PATH"
# Boost 1.75 (the version that ships with AlmaLinux 9 / manylinux_2_34)
# has a missing-include bug: asio/awaitable.hpp uses `std::exchange`
# without `#include <utility>`. Newer compilers don't pull `<utility>`
# in transitively, so the Wt build fails on `WIOService.C`. Force-
# include `<utility>` globally as a workaround. Fixed upstream in
# Boost 1.81.
CXXFLAGS = "-include utility"
