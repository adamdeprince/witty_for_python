name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout (with extern/wt + extern/tinymce submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Node + Yarn are required to build the vendored TinyMCE submodule.
      # We pin Node 20 (LTS) and use Corepack to provide Yarn at the version
      # TinyMCE's yarn.lock expects.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # The yarn cache key uses the TinyMCE submodule's yarn.lock — when
          # the submodule SHA changes the lock typically changes too, so this
          # naturally invalidates with version bumps.
          cache: yarn
          cache-dependency-path: extern/tinymce/yarn.lock

      - name: Enable Yarn via Corepack
        run: corepack enable yarn

      - name: Install Boost + zlib + libharu + libpng + ninja (Wt build deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libboost-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            zlib1g-dev \
            libhpdf-dev \
            libpng-dev \
            ninja-build

      # ccache wraps the compiler and caches object files keyed on input content.
      # On a hot cache the Wt compile (~7 minutes from scratch) drops to seconds;
      # only linking stays. Cache key embeds the extern/wt submodule SHA so a
      # Wt version bump invalidates the cache cleanly.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-wt-${{ hashFiles('.gitmodules', 'extern/wt/.git/HEAD') }}
          max-size: 500M

      # TinyMCE's `yarn build` is the long pole (~5 min cold). Cache the
      # built output directory keyed on the submodule SHA so PRs that don't
      # touch TinyMCE skip the build entirely.
      - name: Cache TinyMCE build output
        id: tinymce-cache
        uses: actions/cache@v4
        with:
          path: extern/tinymce/modules/tinymce/js/tinymce
          key: tinymce-dist-${{ hashFiles('extern/tinymce/.git/HEAD', 'extern/tinymce/yarn.lock') }}

      - name: Install Python build helpers
        run: |
          python -m pip install --upgrade pip
          pip install nanobind 'scikit-build-core>=0.10' cmake ninja

      - name: Build + install witty_for_python (editable, + test extra)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          pip install --no-build-isolation -e ".[test]"

      - name: pytest
        run: pytest -v
