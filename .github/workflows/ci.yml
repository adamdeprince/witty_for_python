name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout (with extern/wt submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Boost + zlib + ninja (Wt's build-time system deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libboost-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            zlib1g-dev \
            ninja-build

      # ccache wraps the compiler and caches object files keyed on input content.
      # On a hot cache the Wt compile (~7 minutes from scratch) drops to seconds;
      # only linking stays. Cache key embeds the extern/wt submodule SHA so a
      # Wt version bump invalidates the cache cleanly.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-wt-${{ hashFiles('.gitmodules', 'extern/wt/.git/HEAD') }}
          max-size: 500M

      - name: Install Python build helpers
        run: |
          python -m pip install --upgrade pip
          pip install nanobind 'scikit-build-core>=0.10' cmake ninja

      - name: Build + install witty_for_python (editable, + test extra)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          pip install --no-build-isolation -e ".[test]"

      - name: pytest
        run: pytest -v
